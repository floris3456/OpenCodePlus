name: "setup-ocp"
description: "Prepare OpenCode Plus build environment with pinned Bun and frozen lockfile"

inputs:
  bun-version:
    description: "Exact Bun version to install (defaults to 1.4.2 from release/toolchain.json)"
    required: false
    default: "1.4.2"
  expected-sha256:
    description: "Recorded SHA256 checksum of the extracted Bun executable for this platform; the step fails closed when this is not a recorded 64-hex value"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Verify Bun executable SHA256
      shell: bash
      env:
        EXPECTED_SHA_INPUT: ${{ inputs.expected-sha256 }}
      run: |
        BUN_BIN="$(which bun)"
        if [ -z "$BUN_BIN" ] || [ ! -f "$BUN_BIN" ]; then
          echo "::error::Bun executable not found on PATH"
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL_SHA=$(sha256sum "$BUN_BIN" | awk '{print $1}')
        else
          ACTUAL_SHA=$(shasum -a 256 "$BUN_BIN" | awk '{print $1}')
        fi

        OS="$(uname -s)"
        ARCH="$(uname -m)"

        EXPECTED_SHA="$EXPECTED_SHA_INPUT"
        if [ "$EXPECTED_SHA" = "null" ] || [ "$EXPECTED_SHA" = "TODO" ]; then
          EXPECTED_SHA=""
        fi

        # Bun ships a different executable for every platform, so a recorded hash only
        # means anything on the platform it was measured on. The expected value must
        # come from the caller (the build matrix / workflow input) for this platform:
        # there is no built-in fallback, and the expected value is never read through
        # the executable being verified. An absent, sentinel, or malformed pin is an
        # unmeasured toolchain, and an unmeasured toolchain must not proceed.
        if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::No expected Bun executable SHA256 recorded for ${OS}/${ARCH}; refusing to continue with an unverified toolchain. Measure the sha256 of the extracted Bun executable for this platform and pass it as expected-sha256 (build matrix bun_sha256)."
          exit 1
        fi

        if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::Bun executable SHA256 mismatch! Expected: $EXPECTED_SHA, Got: $ACTUAL_SHA"
          exit 1
        fi
        echo "Verified Bun executable SHA256 matches pinned value: $EXPECTED_SHA"

    - name: Install dependencies (frozen)
      shell: bash
      run: bun install --frozen-lockfile
