name: ocp-build

on:
  push:
    branches:
      - v2
    tags:
      - "v*"
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCODE_CHANNEL: plus
  TZ: UTC
  LC_ALL: C.UTF-8
  BUN_COMPILE_RELEASE: bun-v1.4.2

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_sha256: "616f267a34278ff5ac282df37ffdfba1d7141f4f6926bca99af2cd6ef3ad32b1"
          - target: linux-x64
            runner: ubuntu-24.04
            bun_sha256: null # TODO: measuredBy: build-seat
          - target: darwin-arm64
            runner: macos-15
            bun_sha256: null # TODO: measuredBy: build-seat
          - target: darwin-x64
            runner: macos-15-intel
            bun_sha256: null # TODO: measuredBy: build-seat
    runs-on: ${{ matrix.runner }}
    env:
      OPENCODE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Pin SOURCE_DATE_EPOCH from source commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"

      - name: Setup OpenCode Plus
        uses: ./.github/actions/setup-ocp
        with:
          bun-version: "1.4.2"
          expected-sha256: ${{ matrix.bun_sha256 }}

      - name: Build target binary
        run: |
          bun packages/cli/script/build.ts --target=opencode2-${{ matrix.target }}

      - name: Package target artifact
        run: |
          bun -e '
            import { readFile, writeFile, mkdir } from "node:fs/promises"
            import { join } from "node:path"
            import { packageTarget, computeRecipeDigest, loadRecipeInputs } from "./packages/plus/script/release.ts"
            import { Release } from "./packages/plus/src/release/identity.js"

            const target = process.env.TARGET
            const version = process.env.OPENCODE_VERSION
            const sourceDateEpoch = Number(process.env.SOURCE_DATE_EPOCH) || 0
            const binaryPath = `packages/cli/dist/cli-${target}/bin/opencode2`

            const binaryContent = await readFile(binaryPath)
            const sourceSha = (await Bun.$`git rev-parse HEAD`.text()).trim()

            const toolchainFile = Bun.file("release/toolchain.json")
            const toolchain = (await toolchainFile.exists()) ? await toolchainFile.json() : {}
            const toolchainDigest = Release.computeToolchainDigest(toolchain)

            const recipeInputs = await loadRecipeInputs({ repoRoot: process.cwd(), version })
            const recipeDigest = computeRecipeDigest(recipeInputs)

            const licenseFile = Bun.file("LICENSE")
            const licenseContent = (await licenseFile.exists()) ? await licenseFile.text() : undefined

            const noticeFile = Bun.file("NOTICE")
            const noticeContent = (await noticeFile.exists()) ? await noticeFile.text() : undefined

            const packaged = packageTarget({
              target,
              binaryContent,
              version,
              sourceSha,
              recipeDigest,
              toolchainDigest,
              licenseContent,
              noticeContent,
              sourceDateEpoch,
            })

            const outDir = "dist/release"
            await mkdir(outDir, { recursive: true })
            const archivePath = join(outDir, packaged.artifact.archiveName)
            await writeFile(archivePath, packaged.archiveBuffer)

            const shaPath = `${archivePath}.sha256`
            await writeFile(shaPath, `${packaged.artifact.archiveSha256}  ${packaged.artifact.archiveName}\n`)

            const metaPath = join(outDir, `${packaged.artifact.archiveName}.meta.json`)
            await writeFile(metaPath, JSON.stringify(packaged.artifact, null, 2) + "\n")

            console.log(`Packaged ${packaged.artifact.archiveName} (${packaged.artifact.bytes} bytes, sha256: ${packaged.artifact.archiveSha256})`)
          '
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload target build artifact and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocp-artifact-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  record-release:
    name: record release bundle
    needs: [build]
    runs-on: ubuntu-24.04
    env:
      OPENCODE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Pin SOURCE_DATE_EPOCH from source commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"

      - name: Setup OpenCode Plus
        uses: ./.github/actions/setup-ocp
        with:
          bun-version: "1.4.2"

      - name: Download all target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/artifacts

      - name: Assemble release manifest and checksums
        run: |
          bun -e '
            import { readFile, writeFile, mkdir, copyFile } from "node:fs/promises"
            import { join } from "node:path"
            import { glob } from "glob"
            import {
              createReleaseManifest,
              serializeReleaseManifest,
              generateSha256Sums,
              verifyReleaseDirectory,
            } from "./packages/plus/script/release.ts"
            import { Release } from "./packages/plus/src/release/identity.js"
            import { computeRecipeDigest, loadRecipeInputs } from "./packages/plus/script/release/recipe.js"

            const outDir = "dist/release-bundle"
            await mkdir(outDir, { recursive: true })

            const version = process.env.OPENCODE_VERSION
            const sourceSha = (await Bun.$`git rev-parse HEAD`.text()).trim()

            const toolchainFile = Bun.file("release/toolchain.json")
            const toolchain = (await toolchainFile.exists()) ? await toolchainFile.json() : {}
            const toolchainDigest = Release.computeToolchainDigest(toolchain)

            const recipeInputs = await loadRecipeInputs({ repoRoot: process.cwd(), version })
            const recipeDigest = computeRecipeDigest(recipeInputs)

            const artifacts = []
            const checksumEntries = []

            const metaFiles = await glob("dist/artifacts/**/opencodeplus-*.tar.gz.meta.json")
            metaFiles.sort()

            for (const metaFile of metaFiles) {
              const meta = JSON.parse(await readFile(metaFile, "utf8"))
              artifacts.push(meta)

              const archiveSrc = metaFile.replace(/\.meta\.json$/, "")
              const archiveDest = join(outDir, meta.archiveName)
              await copyFile(archiveSrc, archiveDest)

              checksumEntries.push({
                filename: meta.archiveName,
                sha256: meta.archiveSha256,
              })
            }

            const installerSrc = "install.sh"
            const installerBuffer = await readFile(installerSrc)
            const installerSha256 = new Bun.CryptoHasher("sha256").update(installerBuffer).digest("hex")
            const installerDest = join(outDir, "install.sh")
            await writeFile(installerDest, installerBuffer, { mode: 0o755 })
            checksumEntries.push({
              filename: "install.sh",
              sha256: installerSha256,
            })

            const releaseIdentity = {
              product: "opencodeplus",
              channel: "plus",
              version,
              sourceSha,
              recipeDigest,
              toolchainDigest,
            }

            const manifest = createReleaseManifest({
              release: releaseIdentity,
              artifacts,
              unqualifiedTargets: ["win32-x64", "win32-arm64"],
              installerSha256,
              generatedAt: new Date(0).toISOString(),
            })

            const manifestJson = serializeReleaseManifest(manifest)
            const manifestDest = join(outDir, "release.json")
            await writeFile(manifestDest, manifestJson)

            const manifestSha256 = new Bun.CryptoHasher("sha256").update(Buffer.from(manifestJson, "utf8")).digest("hex")
            checksumEntries.push({
              filename: "release.json",
              sha256: manifestSha256,
            })

            const sums = generateSha256Sums(checksumEntries)
            const sumsDest = join(outDir, "SHA256SUMS")
            await writeFile(sumsDest, sums)

            const report = await verifyReleaseDirectory(outDir)
            console.log("Release bundle assembled and verified:", report)
          '

      - name: Upload recorded release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocp-release-assets
          path: dist/release-bundle/
          if-no-files-found: error
