name: ocp-build

on:
  push:
    branches:
      - v2
    tags:
      - "v*"
  pull_request:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCODE_CHANNEL: plus
  TZ: UTC
  LC_ALL: C.UTF-8
  BUN_COMPILE_RELEASE: bun-v1.4.2

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # bun_sha256 is the sha256 of the extracted Bun executable from Bun's
          # official bun-v1.4.2 release archive for each platform, cross-checked
          # against that release's SHASUMS256.txt. setup-ocp fails closed when a
          # target's value is missing or malformed.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bun_sha256: "616f267a34278ff5ac282df37ffdfba1d7141f4f6926bca99af2cd6ef3ad32b1"
          - target: linux-x64
            runner: ubuntu-24.04
            bun_sha256: "a83d263767d839e4d2649ca8e35d07159c7afc99afdc96d731ced29e056dda0c"
          - target: darwin-arm64
            runner: macos-15
            bun_sha256: "35d20dd0263e5c950194434b925454fdfa9ba6e4467da960410fa05b08a7a5b5"
          - target: darwin-x64
            runner: macos-15-intel
            bun_sha256: "2fa513af22ac59e03aae640cad302e73cb1ddb0f6398501e2ddccf7dcd613596"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Tags carry the leading "v" (v0.0.0-plus-r4.1); versions do not
      # (0.0.0-plus-r4.1). The binary, the inner metadata, release.json, and
      # install.sh all compare against the unprefixed form, so the tag form is
      # stripped here once instead of being carried into any artifact.
      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA}"
          fi
          if [ -z "${version}" ]; then
            echo "cannot resolve OPENCODE_VERSION from ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "OPENCODE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved OPENCODE_VERSION=${version} from ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"

      - name: Pin SOURCE_DATE_EPOCH from source commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"

      - name: Setup OpenCode Plus
        uses: ./.github/actions/setup-ocp
        with:
          bun-version: "1.4.2"
          expected-sha256: ${{ matrix.bun_sha256 }}

      - name: Resolve build identity
        run: |
          bun -e '
            import { appendFile } from "node:fs/promises"
            import { computeRecipeDigest, loadRecipeInputs } from "./packages/plus/script/release/recipe.js"
            import { Release } from "./packages/plus/src/release/identity.js"

            const version = process.env.OPENCODE_VERSION
            const sourceSha = (await Bun.$`git rev-parse HEAD`.text()).trim()

            const toolchainFile = Bun.file("release/toolchain.json")
            const toolchain = (await toolchainFile.exists()) ? await toolchainFile.json() : {}

            const recipeInputs = await loadRecipeInputs({ repoRoot: process.cwd(), version })

            const lines = [
              `OPENCODE_SOURCE_SHA=${sourceSha}`,
              `OPENCODE_RECIPE_DIGEST=${computeRecipeDigest(recipeInputs)}`,
              `OPENCODE_TOOLCHAIN_DIGEST=${Release.computeToolchainDigest(toolchain)}`,
              `OPENCODE_TARGET=${process.env.TARGET}`,
              "",
            ]

            await appendFile(process.env.GITHUB_ENV, lines.join("\n"))
            console.log(lines.join("\n"))
          '
        env:
          TARGET: ${{ matrix.target }}

      - name: Build target binary
        run: |
          set -euo pipefail

          # --single restricts the build to this runner's own platform and architecture,
          # so a target can only ever be produced on native hardware. The assertions below
          # turn a non-native runner into a failed job instead of a cross-compiled artifact.
          bun packages/cli/script/build-plus.ts --single

          produced=$(ls -d packages/cli/dist/cli-* | wc -l | tr -d " ")
          if [ "$produced" != "1" ]; then
            echo "expected exactly one native build output, found ${produced}" >&2
            ls -d packages/cli/dist/cli-* >&2
            exit 1
          fi
          if [ ! -x "packages/cli/dist/cli-${TARGET}/bin/opencodeplus" ]; then
            echo "runner produced no ${TARGET} binary; it is not native for this target" >&2
            ls -d packages/cli/dist/cli-* >&2
            exit 1
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Package target artifact
        run: |
          bun -e '
            import { readFile, writeFile, mkdir } from "node:fs/promises"
            import { join } from "node:path"
            import { packageTarget, computeRecipeDigest, loadRecipeInputs } from "./packages/plus/script/release.ts"
            import { Release } from "./packages/plus/src/release/identity.js"

            const target = process.env.TARGET
            const version = process.env.OPENCODE_VERSION
            const sourceDateEpoch = Number(process.env.SOURCE_DATE_EPOCH) || 0
            const binaryPath = `packages/cli/dist/cli-${target}/bin/opencodeplus`

            const binaryContent = await readFile(binaryPath)
            const sourceSha = (await Bun.$`git rev-parse HEAD`.text()).trim()

            const toolchainFile = Bun.file("release/toolchain.json")
            const toolchain = (await toolchainFile.exists()) ? await toolchainFile.json() : {}
            const toolchainDigest = Release.computeToolchainDigest(toolchain)

            const recipeInputs = await loadRecipeInputs({ repoRoot: process.cwd(), version })
            const recipeDigest = computeRecipeDigest(recipeInputs)

            const licenseFile = Bun.file("LICENSE")
            const licenseContent = (await licenseFile.exists()) ? await licenseFile.text() : undefined

            const noticeFile = Bun.file("NOTICE")
            const noticeContent = (await noticeFile.exists()) ? await noticeFile.text() : undefined

            const packaged = packageTarget({
              target,
              binaryContent,
              version,
              sourceSha,
              recipeDigest,
              toolchainDigest,
              licenseContent,
              noticeContent,
              sourceDateEpoch,
            })

            const outDir = "dist/release"
            await mkdir(outDir, { recursive: true })
            const archivePath = join(outDir, packaged.artifact.archiveName)
            await writeFile(archivePath, packaged.archiveBuffer)

            const shaPath = `${archivePath}.sha256`
            await writeFile(shaPath, `${packaged.artifact.archiveSha256}  ${packaged.artifact.archiveName}\n`)

            const metaPath = join(outDir, `${packaged.artifact.archiveName}.meta.json`)
            await writeFile(metaPath, JSON.stringify(packaged.artifact, null, 2) + "\n")

            console.log(`Packaged ${packaged.artifact.archiveName} (${packaged.artifact.bytes} bytes, sha256: ${packaged.artifact.archiveSha256})`)
          '
        env:
          TARGET: ${{ matrix.target }}

      # A successful compile is not qualification. This step runs the packaged binary on
      # the same native runner that produced it, so a target that builds but cannot start
      # fails its own job instead of shipping green.
      - name: Qualify target binary with native cold-runtime gate
        timeout-minutes: 15
        run: |
          set -euo pipefail

          if [ -z "${RUNNER_TEMP}" ]; then
            echo "gate: RUNNER_TEMP is not set; refusing to pick a scratch directory" >&2
            exit 1
          fi

          gate="${RUNNER_TEMP}/ocp-cold-gate"
          rm -rf "$gate"
          mkdir -p "$gate/root" "$gate/home" "$gate/cwd" "$gate/tmp" "$gate/out" "$gate/path"

          case "$gate" in
            "${GITHUB_WORKSPACE}"*)
              echo "gate: refusing to qualify from inside the checkout (${gate})" >&2
              exit 1
              ;;
          esac

          probe="$gate/cwd"
          while :; do
            if [ -e "$probe/node_modules" ]; then
              echo "gate: node_modules is reachable from the cold working directory (${probe}/node_modules)" >&2
              exit 1
            fi
            if [ "$probe" = "/" ]; then break; fi
            probe=$(dirname "$probe")
          done

          # setup-ocp puts Bun on PATH, so coldness has to be produced and proven rather
          # than assumed: env -i drops the entire build environment, PATH points at an
          # empty directory, HOME at an empty directory, and the cwd sits outside the tree.
          cold() {
            ( cd "$gate/cwd" && exec env -i PATH="$gate/path" HOME="$gate/home" TMPDIR="$gate/tmp" "$@" )
          }

          if cold /bin/sh -c "command -v bun" >/dev/null 2>&1; then
            echo "gate: bun is still resolvable inside the cold environment" >&2
            exit 1
          fi
          if cold /bin/sh -c "command -v node" >/dev/null 2>&1; then
            echo "gate: node is still resolvable inside the cold environment" >&2
            exit 1
          fi
          if [ -n "$(ls -A "$gate/path")" ]; then
            echo "gate: the cold PATH directory is not empty" >&2
            exit 1
          fi
          if [ -n "$(ls -A "$gate/home")" ]; then
            echo "gate: the cold HOME is not empty" >&2
            exit 1
          fi
          echo "gate: cold environment verified - no bun, no node, empty PATH, empty HOME, cwd ${gate}/cwd"

          tar -xzf "dist/release/opencodeplus-${TARGET}.tar.gz" -C "$gate/root"
          bin="$gate/root/bin/opencodeplus"
          if [ ! -x "$bin" ]; then
            echo "gate: packaged artifact has no executable bin/opencodeplus" >&2
            exit 1
          fi

          run_cold() {
            label="$1"
            shift
            set +e
            cold "$bin" "$@" >"$gate/out/${label}.stdout" 2>"$gate/out/${label}.stderr"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "gate: ${label} exited ${status}" >&2
              cat "$gate/out/${label}.stderr" >&2
              exit 1
            fi
            sed "s/^/gate: ${label} stderr: /" "$gate/out/${label}.stderr"
          }

          # The repository already treats the version as a whitespace-separated token with
          # an optional leading "v" (see packages/desktop/src/main/remote/cli.ts), so match
          # a whole token rather than a substring of the line.
          run_cold version --version
          if ! awk -v want="$OPENCODE_VERSION" '{ for (i = 1; i <= NF; i++) if ($i == want || $i == ("v" want)) found = 1 } END { exit(found ? 0 : 1) }' "$gate/out/version.stdout"; then
            echo "gate: --version does not report ${OPENCODE_VERSION}" >&2
            cat "$gate/out/version.stdout" >&2
            exit 1
          fi
          echo "gate: --version reports ${OPENCODE_VERSION}:"
          cat "$gate/out/version.stdout"

          run_cold build-info build-info --json
          cat "$gate/out/build-info.stdout"

          expect_field() {
            if ! grep -Fq "\"$1\": \"$2\"" "$gate/out/build-info.stdout"; then
              echo "gate: build-info $1 is not ${2}" >&2
              exit 1
            fi
          }
          expect_field product opencodeplus
          expect_field channel plus
          expect_field version "$OPENCODE_VERSION"
          expect_field sourceSha "$GITHUB_SHA"
          expect_field recipeDigest "$OPENCODE_RECIPE_DIGEST"
          expect_field toolchainDigest "$OPENCODE_TOOLCHAIN_DIGEST"
          expect_field target "$TARGET"
          if grep -q null "$gate/out/build-info.stdout"; then
            echo "gate: build-info claims an unmeasured field" >&2
            exit 1
          fi
          echo "gate: build-info carries this commit (${GITHUB_SHA}) and no unmeasured field"

          # The embedded MCP server must speak JSON-RPC on stdout and stay silent on
          # stderr; any diagnostic on either stream corrupts a real client session.
          mkfifo "$gate/mcp.in"
          # Fd 9 keeps the write end open so the server can be fed and then given a real
          # stdin EOF. It is closed in the child (9>&-), otherwise the child would inherit
          # a writer of its own stdin and never see that EOF.
          exec 9<>"$gate/mcp.in"
          cold "$bin" search-mcp <"$gate/mcp.in" >"$gate/out/mcp.stdout" 2>"$gate/out/mcp.stderr" 9>&- &
          mcp_pid=$!
          printf "%s\n" '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ocp-cold-gate","version":"1.0.0"}}}' >&9

          waited=0
          while [ "$waited" -lt 120 ]; do
            if grep -q "serverInfo" "$gate/out/mcp.stdout" 2>/dev/null; then break; fi
            if ! kill -0 "$mcp_pid" 2>/dev/null; then break; fi
            sleep 1
            waited=$((waited + 1))
          done

          exec 9>&-
          waited=0
          while [ "$waited" -lt 30 ] && kill -0 "$mcp_pid" 2>/dev/null; do
            sleep 1
            waited=$((waited + 1))
          done
          if kill -0 "$mcp_pid" 2>/dev/null; then
            kill "$mcp_pid" 2>/dev/null || true
            echo "gate: search-mcp did not exit after stdin EOF" >&2
            exit 1
          fi
          if wait "$mcp_pid"; then mcp_status=0; else mcp_status=$?; fi
          if [ "$mcp_status" -ne 0 ]; then
            echo "gate: search-mcp exited ${mcp_status}" >&2
            cat "$gate/out/mcp.stderr" >&2
            exit 1
          fi

          if [ -s "$gate/out/mcp.stderr" ]; then
            echo "gate: search-mcp wrote to stderr" >&2
            cat "$gate/out/mcp.stderr" >&2
            exit 1
          fi
          if [ ! -s "$gate/out/mcp.stdout" ]; then
            echo "gate: search-mcp answered nothing on stdout" >&2
            exit 1
          fi

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              "{"*) ;;
              *)
                echo "gate: non-protocol traffic on search-mcp stdout: ${line}" >&2
                exit 1
                ;;
            esac
            if ! printf "%s" "$line" | grep -Fq '"jsonrpc":"2.0"'; then
              echo "gate: stdout line is not a JSON-RPC 2.0 message: ${line}" >&2
              exit 1
            fi
          done <"$gate/out/mcp.stdout"

          for expected in '"id":1' '"result"' '"protocolVersion"' '"name":"opencodeplus-search"'; do
            if ! grep -Fq "$expected" "$gate/out/mcp.stdout"; then
              echo "gate: initialize response is missing ${expected}" >&2
              cat "$gate/out/mcp.stdout" >&2
              exit 1
            fi
          done

          cat "$gate/out/mcp.stdout"
          echo "gate: ${TARGET} passed the native cold-runtime qualification gate on ${RUNNER_OS}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload target build artifact and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocp-artifact-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  record-release:
    name: record release bundle
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Same convention as the build job: the git tag keeps its "v", the
      # version recorded in release.json does not.
      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA}"
          fi
          if [ -z "${version}" ]; then
            echo "cannot resolve OPENCODE_VERSION from ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "OPENCODE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved OPENCODE_VERSION=${version} from ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"

      - name: Pin SOURCE_DATE_EPOCH from source commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"

      - name: Setup OpenCode Plus
        uses: ./.github/actions/setup-ocp
        with:
          bun-version: "1.4.2"
          # This job runs on ubuntu-24.04, so it pins the linux-x64 executable
          # identity recorded in the build matrix; setup-ocp fails closed without it.
          expected-sha256: "a83d263767d839e4d2649ca8e35d07159c7afc99afdc96d731ced29e056dda0c"

      - name: Download all target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/artifacts

      - name: Assemble release manifest and checksums
        run: |
          bun -e '
            import { readFile, writeFile, mkdir, copyFile } from "node:fs/promises"
            import { join } from "node:path"
            import { glob } from "glob"
            import {
              createReleaseManifest,
              serializeReleaseManifest,
              generateSha256Sums,
              verifyReleaseDirectory,
            } from "./packages/plus/script/release.ts"
            import { Release } from "./packages/plus/src/release/identity.js"
            import { computeRecipeDigest, loadRecipeInputs } from "./packages/plus/script/release/recipe.js"

            const outDir = "dist/release-bundle"
            await mkdir(outDir, { recursive: true })

            const version = process.env.OPENCODE_VERSION
            const sourceSha = (await Bun.$`git rev-parse HEAD`.text()).trim()

            const toolchainFile = Bun.file("release/toolchain.json")
            const toolchain = (await toolchainFile.exists()) ? await toolchainFile.json() : {}
            const toolchainDigest = Release.computeToolchainDigest(toolchain)

            const recipeInputs = await loadRecipeInputs({ repoRoot: process.cwd(), version })
            const recipeDigest = computeRecipeDigest(recipeInputs)

            const artifacts = []
            const checksumEntries = []

            const metaFiles = await glob("dist/artifacts/**/opencodeplus-*.tar.gz.meta.json")
            metaFiles.sort()

            for (const metaFile of metaFiles) {
              const meta = JSON.parse(await readFile(metaFile, "utf8"))
              artifacts.push(meta)

              const archiveSrc = metaFile.replace(/\.meta\.json$/, "")
              const archiveDest = join(outDir, meta.archiveName)
              await copyFile(archiveSrc, archiveDest)

              checksumEntries.push({
                filename: meta.archiveName,
                sha256: meta.archiveSha256,
              })
            }

            const installerSrc = "install.sh"
            const installerBuffer = await readFile(installerSrc)
            const installerSha256 = new Bun.CryptoHasher("sha256").update(installerBuffer).digest("hex")
            const installerDest = join(outDir, "install.sh")
            await writeFile(installerDest, installerBuffer, { mode: 0o755 })
            checksumEntries.push({
              filename: "install.sh",
              sha256: installerSha256,
            })

            const releaseIdentity = {
              product: "opencodeplus",
              channel: "plus",
              version,
              sourceSha,
              recipeDigest,
              toolchainDigest,
            }

            const manifest = createReleaseManifest({
              release: releaseIdentity,
              artifacts,
              unqualifiedTargets: ["win32-x64", "win32-arm64"],
              installerSha256,
              generatedAt: new Date(0).toISOString(),
            })

            const manifestJson = serializeReleaseManifest(manifest)
            const manifestDest = join(outDir, "release.json")
            await writeFile(manifestDest, manifestJson)

            const manifestSha256 = new Bun.CryptoHasher("sha256").update(Buffer.from(manifestJson, "utf8")).digest("hex")
            checksumEntries.push({
              filename: "release.json",
              sha256: manifestSha256,
            })

            const sums = generateSha256Sums(checksumEntries)
            const sumsDest = join(outDir, "SHA256SUMS")
            await writeFile(sumsDest, sums)

            const report = await verifyReleaseDirectory(outDir)
            console.log("Release bundle assembled and verified:", report)
          '

      - name: Upload recorded release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocp-release-assets
          path: dist/release-bundle/
          if-no-files-found: error
